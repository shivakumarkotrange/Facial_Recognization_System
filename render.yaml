services:
  - type: web
    name: deepfer-backend
    env: python
    plan: free
    pythonVersion: "3.11"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
